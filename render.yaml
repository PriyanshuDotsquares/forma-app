# Render Blueprint for the FORMA API.
# https://render.com/docs/blueprint-spec
#
# This tracks the deployed service's shape (build, start command, env var
# names) in the repo. Secret values are NOT stored here — `sync: false`
# vars must still be set once in the Render dashboard.
services:
  - type: web
    name: forma-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["*"]'
